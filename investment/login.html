<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>私人投資工具｜登入</title><link rel="stylesheet" href="/style.css"><script type="module" src="/login.js"></script></head><body><main class="login"><p class="eyebrow">個人投資工作空間</p><h1>投資曝險管理</h1><p>僅供擁有者登入。資料保存在此裝置的瀏覽器。</p><form id="login"><label>擁有者帳號<input name="username" autocomplete="username" required maxlength="100"></label><label>密碼<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><button>登入</button></form><p id="message" role="alert"></p><p class="muted">跨裝置請使用備份匯出／匯入。此工具不執行真實交易。</p></main></body></html>
